name: Build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # The release build is unsigned here; it runs R8 so shrinking problems show up before tagging.
      - name: Build debug and release APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload arm64 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: yoink-debug-arm64-v8a
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: error
