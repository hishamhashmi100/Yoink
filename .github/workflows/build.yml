name: Build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # The release build is unsigned here; it runs R8 so shrinking problems show up before tagging.
      - name: Build the test and release APKs
        run: ./gradlew assembleBeta assembleRelease -PtestBuild=${{ github.run_number }} --stacktrace

      # Release builds are shrunk by R8. Fail here if it removed what the downloader needs to unpack
      # Python, instead of finding out from a crash on someone's phone.
      - name: Check the release APK kept the downloader's classes
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk
          tool="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/apkanalyzer | head -n 1)"
          "$tool" dex packages --defined-only "$apk" > dex.txt
          for name in \
            "com.yausername.youtubedl_common.utils.ZipUtils" \
            "org.apache.commons.compress.archivers.zip.ExtraFieldUtils" \
            "org.apache.commons.compress.archivers.zip.AsiExtraField <init>()" \
            "org.apache.commons.compress.archivers.zip.X5455_ExtendedTimestamp <init>()" \
            "org.apache.commons.compress.archivers.zip.Zip64ExtendedInformationExtraField <init>()"; do
            if grep -qF "$name" dex.txt; then echo "ok: $name"; else echo "::error::Missing from release APK: $name"; exit 1; fi
          done

      # "Yoink Test", to try on a phone before a release (see README → Testing on your phone).
      - name: Upload the test APK
        uses: actions/upload-artifact@v4
        with:
          name: yoink-test-${{ github.run_number }}
          path: app/build/outputs/apk/beta/app-arm64-v8a-beta.apk
          if-no-files-found: error
