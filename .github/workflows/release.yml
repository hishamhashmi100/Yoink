name: Release

on:
  push:
    # A capital V (V1.2.3) works too.
    tags: ["v*", "V*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (see README, 'Signing releases')"
            exit 1
          fi

      - name: Build release APKs
        run: ./gradlew assembleRelease -PappVersion="${GITHUB_REF_NAME#[vV]}" --stacktrace

      # The file names never change: the website links to releases/latest/download/<name>.
      - name: Sign and rename
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          out=app/build/outputs/apk/release
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a universal; do
            "$build_tools/zipalign" -f 4 "$out/app-$abi-release-unsigned.apk" "$RUNNER_TEMP/aligned.apk"
            "$build_tools/apksigner" sign \
              --ks "$keystore" \
              --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass env:KEY_PASSWORD \
              --out "dist/yoink-$abi.apk" \
              "$RUNNER_TEMP/aligned.apk"
            "$build_tools/apksigner" verify "dist/yoink-$abi.apk"
          done
          rm -f "$keystore"
          (cd dist && sha256sum yoink-arm64-v8a.apk yoink-armeabi-v7a.apk yoink-universal.apk > SHA256SUMS.txt)
          ls -l dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files="dist/yoink-arm64-v8a.apk dist/yoink-armeabi-v7a.apk dist/yoink-universal.apk dist/SHA256SUMS.txt"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $files --clobber
          else
            gh release create "$GITHUB_REF_NAME" $files --title "Yoink $GITHUB_REF_NAME" --generate-notes
          fi
